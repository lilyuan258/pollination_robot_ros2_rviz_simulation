controller_manager:
  ros__parameters:
    update_rate: 100

    only_robot_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

only_robot_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint_1
      - joinit_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    allow_nonzero_velocity_at_trajectory_end: true
